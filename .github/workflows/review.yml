# Asks Claude for a code review of a pull request in this repository, when the repository's owner comments on it with
# a first line starting `> orb ponder`. The rest of the comment is passed on as instructions, and the comment gets a
# 👀 reaction once the request is sent. It calls this repository's own review workflow, pinned below by commit, as
# examples/claude-review.yml does for any other repository.
#
# Only the comment command is listened for: opening a pull request does not start a review.
#
# Comments run this file from the default branch, so the comment command works only once this file is merged there.
#
# Needs, as repository settings:
#   secret CLAUDE_ROUTINE_TOKEN         the code-review routine's bearer token
#   variable CLAUDE_ROUTINE_TRIGGER_ID  the routine's trigger id (`trig_…`)
name: Review

on:
  # zizmor flags issue_comment because anyone who can comment can start this workflow. Accepted: the review workflow
  # acts only on a comment command from the repository's owner, checked by its decide job, and never runs code from
  # the pull request.
  issue_comment: # zizmor: ignore[dangerous-triggers] only the owner's comment command is acted on
    types: [created]

permissions: {}

jobs:
  review:
    # Saves starting runners for comments that cannot be a comment command: only comments on pull requests that start
    # with `>` and contain `orb` (both checks ignore case) go on. The review workflow still checks every rule itself.
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '>')
      && contains(github.event.comment.body, 'orb')
    # The review workflow's jobs can hold no more than this. Only its reaction job uses it, to add 👀 to the comment.
    permissions:
      issues: write
      pull-requests: write
    uses: tobyhede/workflows/.github/workflows/claude-review.yml@d3fc76a58a59431f56b76312afcb0171c1984d74 # personal-v2
    with:
      routine-trigger-id: ${{ vars.CLAUDE_ROUTINE_TRIGGER_ID }}
    secrets:
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
